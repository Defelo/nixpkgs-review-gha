[package]
name = "repo-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Exact-revision GitHub repository reviews through Nix"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"

[dev-dependencies]
