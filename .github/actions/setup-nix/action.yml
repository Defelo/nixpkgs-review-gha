name: setup-nix
description: Pinned Nix bootstrap for disposable, secretless hosted runners
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      with:
        install_url: https://releases.nixos.org/nix/nix-2.34.8/install
        extra_nix_config: |
          accept-flake-config = false
          allow-import-from-derivation = false
          builders =
          max-jobs = 2
          cores = 2
          timeout = 1800
          max-silent-time = 600
          sandbox = ${{ runner.os == 'macOS' && 'relaxed' || 'true' }}
