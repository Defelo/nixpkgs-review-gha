name: build
on:
  workflow_dispatch:
    inputs:
      request:
        description: Structured repo-review JSON (free-form package commands retired)
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  review:
    uses: ./.github/workflows/review-repository.yml
    with:
      request: ${{ inputs.request }}
