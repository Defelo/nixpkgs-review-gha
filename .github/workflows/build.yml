name: build
on:
  workflow_dispatch:
    inputs:
      request:
        description: Structured repo-review JSON (free-form package commands retired)
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix build .#repo-review --out-link tools --no-update-lock-file
      - name: Validate the compatibility request
        env:
          REQUEST: ${{ inputs.request }}
        run: |
          printf '%s' "$REQUEST" | tools/bin/repo-review validate - > request.json
          python3 compatibility-request.py request.json
  review:
    needs: validate
    uses: ./.github/workflows/review-repository.yml
    with:
      request: ${{ inputs.request }}
