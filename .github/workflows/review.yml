name: review
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Nixpkgs PR (explicit merge-mode compatibility adapter)
        required: true
        type: string
      x86_64-linux:
        type: boolean
        default: true
      aarch64-linux:
        type: boolean
        default: false
      x86_64-darwin:
        type: choice
        default: "no"
        options: ["no", yes_sandbox_relaxed]
      aarch64-darwin:
        type: choice
        default: "no"
        options: ["no", yes_sandbox_relaxed]
      extra-args:
        description: Retired; nonempty values rejected
        type: string
      push-to-cache:
        description: Retired; true rejected (use digest-approved publication)
        type: boolean
        default: false
      upterm:
        description: Retired; true rejected
        type: boolean
        default: false
      post-result:
        type: boolean
        default: false
      on-success:
        description: Only nothing supported; no approval/merge authority
        type: choice
        default: nothing
        options: [nothing]
permissions:
  contents: read
  id-token: write
jobs:
  adapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      request: ${{ steps.adapt.outputs.request }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix build .#repo-review --out-link tools --no-update-lock-file
      - id: adapt
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          tools/bin/repo-review legacy --inputs "$INPUTS" > request.json
          printf 'request=%s\n' "$(jq -c . request.json)" >> "$GITHUB_OUTPUT"
  review:
    needs: adapt
    uses: ./.github/workflows/review-repository.yml
    with:
      request: ${{ needs.adapt.outputs.request }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
