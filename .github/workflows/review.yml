name: review
run-name: >-
  review #${{ inputs.pr }}${{
    case(
      inputs.extra-args != '' && inputs.extra-build-args != '',
      format(' ({0} --build-args="{1}")', inputs.extra-args, inputs.extra-build-args),
      inputs.extra-args != '',
      format(' ({0})', inputs.extra-args),
      inputs.extra-build-args != '',
      format(' (--build-args="{0}")', inputs.extra-build-args),
      ''
    )
  }}

permissions: {}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull Request Number"
        required: true
        type: string
      x86_64-linux:
        description: "Run on x86_64-linux"
        required: true
        type: boolean
        default: true
      aarch64-linux:
        description: "Run on aarch64-linux"
        required: true
        type: boolean
        default: true
      x86_64-darwin:
        description: "Run on x86_64-darwin"
        required: true
        type: choice
        default: yes_sandbox_relaxed
        options:
          - "no"
          - yes_sandbox_false
          - yes_sandbox_relaxed
          - yes_sandbox_true
      aarch64-darwin:
        description: "Run on aarch64-darwin"
        required: true
        type: choice
        default: yes_sandbox_relaxed
        options:
          - "no"
          - yes_sandbox_false
          - yes_sandbox_relaxed
          - yes_sandbox_true
      riscv64-linux:
        description: "Run on riscv64-linux (RISE runners)"
        required: true
        type: boolean
        default: false
      codespace:
        description: "Run x86_64-linux in a GitHub Codespace (max 12h), auto uses it if the build won't fit into 6h"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - force
          - disabled
      codespace-size:
        description: "Size of the codespace"
        required: true
        type: choice
        default: 4-core
        options:
          - 2-core
          - 4-core
          - 8-core
          - 16-core
          - 32-core
      allow-unfree:
        description: "Allow unfree packages"
        required: true
        type: boolean
        default: true
      allow-insecure:
        description: "Allow insecure packages"
        required: true
        type: boolean
        default: true
      builders:
        description: "Nix builders to use"
        required: true
        type: choice
        default: "gha"
        options:
          - "gha"
          - "remote"
          - "both"
      extra-args:
        description: "nixpkgs-review extra args"
        required: false
        type: string
      extra-build-args:
        description: "nixpkgs-review extra --build-args"
        required: false
        type: string
      push-to-cache:
        description: "Push to cache"
        required: true
        type: boolean
        default: true
      upterm:
        description: "Start upterm session after nixpkgs-review"
        required: true
        type: boolean
        default: false
      post-result:
        description: "Post Result"
        required: true
        type: boolean
        default: true
      on-success:
        description: "What to do on review success"
        required: true
        type: choice
        default: nothing
        options:
          - nothing
          - mark_as_ready
          - approve
          - merge

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.prepare.outputs.pr }}
      has-codespace-token: ${{ steps.codespace-token.outputs.present }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /review

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - run: nu review/prepare.nu
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUTS: ${{ toJSON(github.event.inputs) }}
          HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' && '1' || '0' }}

      # Checked here because the estimate evaluates the pull request and must not get to see the token
      - name: check codespace token
        id: codespace-token
        run: echo "present=${HAS_CODESPACE_TOKEN}" >> "${GITHUB_OUTPUT}"
        env:
          HAS_CODESPACE_TOKEN: ${{ secrets.CODESPACE_TOKEN != '' && '1' || '0' }}

  # Guess from the derivations that have to be built whether the x86_64-linux build fits into a hosted runner
  estimate:
    # Without a token there is no codespace to use, and with remote builders only the hosted runner does not do the building
    if: ${{ inputs.x86_64-linux && inputs.codespace == 'auto' && inputs.builders != 'remote' && needs.prepare.outputs.has-codespace-token == '1' }}
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A failing estimate must not fail the review, the build then simply runs on a hosted runner
    continue-on-error: true
    outputs:
      codespace: ${{ steps.estimate.outputs.codespace }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codespace
            /review/gha.nu

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - name: setup nix
        uses: $/.github/actions/setup-nix
        with:
          extra-nix-config: ${{ vars.EXTRA_NIX_CONFIG }}
          system: x86_64-linux
          reclaim-space: "false"

      - run: nu codespace/estimate.nu
        id: estimate
        env:
          WORKFLOW: review
          PR_JSON: ${{ needs.prepare.outputs.pr }}
          ALLOW_UNFREE: ${{ inputs.allow-unfree }}
          ALLOW_INSECURE: ${{ inputs.allow-insecure }}
          LIMIT_MINUTES: ${{ vars.CODESPACE_ESTIMATE_LIMIT }}
          GH_TOKEN: ${{ github.token }}

  codespace:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && inputs.x86_64-linux && (inputs.codespace == 'force' || needs.estimate.outputs.codespace == 'true') }}
    needs: [prepare, estimate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      name: ${{ steps.start.outputs.name }}
      label: ${{ steps.start.outputs.label }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codespace
            /review/gha.nu

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - run: nu codespace/start.nu
        id: start
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MACHINE: ${{ inputs.codespace-size }}
          IDLE_TIMEOUT: "30"
          EXTRA_NIX_CONFIG: ${{ vars.EXTRA_NIX_CONFIG }}

  # Two guards take turns because a job can run for at most 6 hours
  codespace-guard:
    if: ${{ needs.codespace.result == 'success' }}
    needs: [codespace]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      continue: ${{ steps.guard.outputs.continue }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codespace
            /review/gha.nu

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - run: nu codespace/guard.nu
        id: guard
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
          NAME: ${{ needs.codespace.outputs.name }}
          BUDGET_MINUTES: "350"

  codespace-guard-2:
    # Also takes over when the first guard crashed, because the build keeps running in the codespace
    if: ${{ !cancelled() && needs.codespace.result == 'success' && (needs.codespace-guard.outputs.continue == 'true' || needs.codespace-guard.result == 'failure') }}
    needs: [codespace, codespace-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codespace
            /review/gha.nu

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - run: nu codespace/guard.nu
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
          NAME: ${{ needs.codespace.outputs.name }}
          BUDGET_MINUTES: "350"

  codespace-stop:
    if: ${{ always() && needs.codespace.result != 'skipped' }}
    needs: [codespace, codespace-guard, codespace-guard-2]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codespace
            /review/gha.nu

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - run: nu codespace/stop.nu
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}

  review:
    needs: [prepare, codespace]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    env:
      CODESPACE: ${{ matrix.system == 'x86_64-linux' && needs.codespace.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
          - x86_64-darwin
          - aarch64-darwin
          - riscv64-linux
        exclude:
          - system: ${{ !inputs.x86_64-linux && 'x86_64-linux' || '' }}
          - system: ${{ !inputs.aarch64-linux && 'aarch64-linux' || '' }}
          - system: ${{ inputs.x86_64-darwin == 'no' && 'x86_64-darwin' || '' }}
          - system: ${{ inputs.aarch64-darwin == 'no' && 'aarch64-darwin' || '' }}
          - system: ${{ !inputs.riscv64-linux && 'riscv64-linux' || '' }}
    runs-on: >-
      ${{ (matrix.system == 'x86_64-linux' && (needs.codespace.result == 'success' && needs.codespace.outputs.label || 'ubuntu-latest'))
      || (matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm')
      || (matrix.system == 'x86_64-darwin' && 'macos-latest')
      || (matrix.system == 'aarch64-darwin' && 'macos-latest')
      || (matrix.system == 'riscv64-linux' && 'ubuntu-24.04-riscv') }}
    # Hosted runners are limited to 6 hours, but a codespace is only stopped by GitHub after 12 hours
    timeout-minutes: ${{ matrix.system == 'x86_64-linux' && needs.codespace.result == 'success' && 705 || 360 }}

    steps:
      - name: ensure codespace
        if: ${{ matrix.system == 'x86_64-linux' && (needs.codespace.result == 'failure' || needs.codespace.result == 'cancelled') }}
        run: |
          echo "::error title=Codespace unavailable::The codespace could not be started, see the codespace job for details."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /review
            /flake.lock
            /flake.nix
            /patches
            /drv-build-support.nix

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - name: setup nix
        if: ${{ env.CODESPACE != 'true' }}
        uses: $/.github/actions/setup-nix
        with:
          extra-nix-config: ${{ vars.EXTRA_NIX_CONFIG }}
          system: ${{ matrix.system }}
          sandbox: ${{
            (matrix.system == 'x86_64-darwin' && inputs.x86_64-darwin == 'yes_sandbox_false'
            || matrix.system == 'aarch64-darwin' && inputs.aarch64-darwin == 'yes_sandbox_false') && 'false'
            || (matrix.system == 'x86_64-darwin' && inputs.x86_64-darwin == 'yes_sandbox_relaxed'
            || matrix.system == 'aarch64-darwin' && inputs.aarch64-darwin == 'yes_sandbox_relaxed') && 'relaxed'
            || 'true' }}
          builders: ${{ inputs.builders != 'gha' && vars.BUILDERS || '' }}
          ssh-key: ${{ inputs.builders != 'gha' && secrets.SSH_KEY || '' }}
          ssh-cert: ${{ inputs.builders != 'gha' && secrets.SSH_CERT || '' }}

      - name: clone nixpkgs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NixOS/nixpkgs
          path: nixpkgs
          persist-credentials: false

      - run: nu review/review.nu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUTS: ${{ toJSON(github.event.inputs) }}
          ATTIC_SERVER: ${{ vars.ATTIC_SERVER }}
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
          PR_JSON: ${{ needs.prepare.outputs.pr }}
          IDENTIFY_STILL_FAILING_PACKAGES: ${{ vars.IDENTIFY_STILL_FAILING_PACKAGES }}
          IDENTIFY_UNSUPPORTED_PACKAGES: ${{ vars.IDENTIFY_UNSUPPORTED_PACKAGES }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report_${{ matrix.system }}.json
          path: report_${{ matrix.system }}.json
          if-no-files-found: error
          archive: false

      - name: upterm is not supported in codespaces
        if: ${{ inputs.upterm && env.CODESPACE == 'true' }}
        run: echo "::warning title=upterm skipped::The runner in the codespace has no root access, so no upterm session is started."

      - name: start upterm session
        if: ${{ inputs.upterm && env.CODESPACE != 'true' }}
        uses: owenthereal/action-upterm@b9dfa526f890bbd5162d781f8d9c69b97731d73d # v2.7.0
        with:
          limit-access-to-actor: true

  report:
    runs-on: ubuntu-latest
    needs: [prepare, review]
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /review

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - run: nu review/report.nu
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INPUTS: ${{ toJSON(github.event.inputs) }}
          PR_JSON: ${{ needs.prepare.outputs.pr }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.workflow_sha }}
          API_URL: ${{ vars.API_URL }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports.json
          path: reports.json
          if-no-files-found: error
          archive: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report.md
          path: report.md
          if-no-files-found: error
          archive: false
