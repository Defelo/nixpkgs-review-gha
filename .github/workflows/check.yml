name: check
on:
  push:
    branches: [main, feat/repository-review-service]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Build CLI and run Rust tests with locked tools
        run: |
          nix build .#repo-review --out-link tools --no-update-lock-file -L
          tools/bin/repo-review verify-engine --root .
          tools/bin/simit init ci --review-only --check --diff
      - name: Check pinned Nixpkgs adapter imports and Attic CLI compatibility
        run: |
          nix build .#checks.x86_64-linux.nixpkgs-selector --no-link --no-update-lock-file -L
          nix shell .#attic-client --command attic push --help
      - name: Format and workflow validation
        run: |
          nix run .#formatter.x86_64-linux -- --ci
          nix shell .#actionlint --command actionlint
      - name: Generated contracts must match Rust types
        run: |
          tools/bin/repo-review schema request > schemas/request.json
          tools/bin/repo-review schema plan > schemas/plan.json
          tools/bin/repo-review schema platform-result > schemas/platform-result.json
          tools/bin/repo-review schema result > schemas/result.json
          tools/bin/repo-review example > examples/request.json
          git diff --exit-code -- schemas examples/request.json
      - name: Secretless exact-revision fixtures and isolated closure transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/ci-fixtures.py
      - name: Actual retrieval misses and signed closure verification
        env:
          REPO_REVIEW_FIXTURE_ROOT: ${{ github.workspace }}/fixture-evidence
        run: |
          engine_revision=$(tools/bin/repo-review engine-info | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')
          git init engine
          git -C engine fetch --depth=1 https://github.com/caniko/simit.git "$engine_revision"
          git -C engine checkout --detach FETCH_HEAD
          test "$(git -C engine rev-parse HEAD)" = "$engine_revision"
          nix shell .#cargo .#rustc .#gcc .#nix --command cargo test --manifest-path engine/Cargo.toml --locked --test review_retrieval -- --ignored
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: fixture-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fixture-evidence/*-plan.json
            fixture-evidence/*/review-result.json
            fixture-evidence/*/*.log
            fixture-evidence/*/effective.lock
            fixture-evidence/*/effective-plan.json
          if-no-files-found: warn
