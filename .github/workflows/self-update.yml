name: self-update
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Propose a non-rewriting upstream integration
        env:
          GH_TOKEN: ${{ secrets.GH_SELF_UPDATE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          upstream=$(gh api "repos/$GITHUB_REPOSITORY" --jq .parent.full_name)
          [[ "$upstream" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$ ]]
          branch="upstream-sync/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git fetch "https://github.com/$upstream.git" HEAD
          git merge --no-edit FETCH_HEAD
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --title 'Integrate upstream (review custom service policy before merging)' --body 'Non-rewriting upstream merge. Normal checks and human review required; conflicts fail this job for manual resolution. No auto-merge.'
